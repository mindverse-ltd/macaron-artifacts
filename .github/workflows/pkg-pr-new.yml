name: pkg.pr.new

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v1
        with:
          install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Keep bun even though deps install with pnpm: the publish step's `npm pack`
      # fires the root `prepack`, which runs `bun build` to bundle the server.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:package
      # `pnpm exec`, not `pnpm dlx`/`bunx`: pkg.pr.new warns against dlx-style
      # runners in CI (they fetch an unpinned build each run). pkg-pr-new is a
      # devDependency, so this executes the lockfile-pinned binary from
      # node_modules/.bin. The mandatory package test above installs and boots
      # the same single-package layout in an empty consumer directory.
      # Force long-form URLs because compact URLs require npm repository metadata;
      # these are only published through pkg.pr.new, and --bin shows a CLI command.
      - run: pnpm exec pkg-pr-new publish --no-compact --bin .
